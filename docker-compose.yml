services:
  mongo:
    image: 192.168.0.155:15050/devops/commonlibs/mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${Mongo_PWD}
      - MONGO_INITDB_DATABASE=appdb
      - TZ=Asia/Kolkata
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: 192.168.0.155:15050/devops/commonlibs/sop-backend:latest
    container_name: backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "28000:8000"
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_USERNAME=admin
      - MONGO_PASSWORD=${Mongo_PWD}
      - MONGO_DB_NAME=appdb
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS="https://sop-tracker.kivicapital.net:1443"
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
    volumes:
      - ./frontend:/app/frontend
      - ./backup-data:/app/backups
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: 192.168.0.155:15050/devops/commonlibs/nginx:alpine
    container_name: frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/certs/kivicapital:/etc/nginx/ssl
    ports:
      - "1443:443"
    depends_on:
      - backend
    networks:
      - app-network
    environment:
      - TZ=Asia/Kolkata

volumes:
  mongo-data:
  backup-data:

networks:
  app-network:
    driver: bridge