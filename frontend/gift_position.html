<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIFT Position Matching SOP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body class="bg-gray-50 min-h-screen p-6">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <a href="dashboard.html" class="text-blue-600 hover:underline flex items-center gap-2">
        🏠 Back to Dashboard
      </a>
      <div class="text-gray-600 text-sm">
        🕐 Last updated: <span id="lastUpdated">Never</span>
      </div>
      <button onclick="saveProgress()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition duration-200 flex items-center gap-2">
        💾 Save Progress
      </button>
    </div>

    <!-- Title -->
    <h1 class="text-4xl font-bold text-center text-blue-700 mb-8">GIFT Position Matching SOP</h1>

    <!-- Useful Links Section -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
        🔗 Useful Links
      </h2>
      <ul class="space-y-2">
        <li>
          <a href="https://docs.google.com/document/d/YOUR_DOC_ID" target="_blank" class="text-blue-600 hover:underline">
            • Gift SOP
          </a>
        </li>
        <li>
          <a href="http://192.168.30.15:18080/tree?dag_id=start_nse_ix_sampler" target="_blank" class="text-blue-600 hover:underline">
            • start_nse_ix_sampler (starts at 06:20am)
          </a>
        </li>
        <li>
          <a href="http://192.168.30.15:18080/tree?dag_id=startDatasnap" target="_blank" class="text-blue-600 hover:underline">
            • startDatasnap (starts at 06:00am)
          </a>
        </li>
      </ul>
    </div>

    <!-- Logit Work Section -->
    <div class="bg-green-50 border-2 border-green-300 rounded-lg p-6 mb-6">
      <h2 class="text-xl font-bold text-green-800 mb-4 flex items-center gap-2">
        ✅ Logit Work
      </h2>
      <div class="space-y-3">
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" id="ledger_done" class="w-5 h-5 cursor-pointer" onchange="saveProgress()">
          <span class="text-gray-700 font-medium">Ledger Done</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" id="logit_started" class="w-5 h-5 cursor-pointer" onchange="saveProgress()">
          <span class="text-gray-700 font-medium">Logit Started</span>
        </label>
      </div>
    </div>

    <!-- Snapshot Checks Section -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
        ⏰ Snapshot Checks (6:30 AM - 3:30 PM, 4:30 PM - 2:45 AM)
      </h2>

      <div class="overflow-x-auto">
        <table class="w-full border-collapse">
          <thead>
            <tr class="bg-blue-100">
              <th class="border border-gray-300 px-4 py-3 text-left font-semibold text-blue-900">Time</th>
              <th class="border border-gray-300 px-4 py-3 text-left font-semibold text-blue-900">OMS</th>
              <th class="border border-gray-300 px-4 py-3 text-left font-semibold text-blue-900">Turnover Report</th>
              <th class="border border-gray-300 px-4 py-3 text-center font-semibold text-blue-900">Matched ✓</th>
            </tr>
          </thead>
          <tbody id="snapshotTableBody">
            <!-- Rows will be generated by JavaScript -->
          </tbody>
        </table>
      </div>

      <div class="mt-6 flex justify-end">
        <button onclick="saveProgress()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-medium transition duration-200">
          💾 Save All Data
        </button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const SOP_TYPE = 'gift_position';
    
    // Time slots: 6:30 AM - 3:30 PM, then 4:30 PM - 2:45 AM
    const timeSlots = [
      // Morning to afternoon (6:30 AM - 3:30 PM)
      '6:30 AM', '7:00 AM', '7:30 AM', '8:00 AM', '8:30 AM',
      '9:00 AM', '9:30 AM', '10:00 AM', '10:30 AM', '11:00 AM', '11:30 AM',
      '12:00 PM', '12:30 PM', '1:00 PM', '1:30 PM', '2:00 PM', '2:30 PM', '3:00 PM', '3:30 PM',
      // Evening to night (4:30 PM - 2:45 AM)
      '4:30 PM', '5:00 PM', '5:30 PM', '6:00 PM', '6:30 PM', '7:00 PM', '7:30 PM', 
      '8:00 PM', '8:30 PM', '9:00 PM', '9:30 PM', '10:00 PM', '10:30 PM', '11:00 PM', '11:30 PM',
      '12:00 AM', '12:30 AM', '1:00 AM', '1:30 AM', '2:00 AM', '2:30 AM', '2:45 AM'
    ];

    let currentUser = null;

    // Initialize page
    document.addEventListener('DOMContentLoaded', async () => {
      if (!api.isAuthenticated()) {
        window.location.href = 'index.html';
        return;
      }

      currentUser = api.getCurrentUser();
      generateSnapshotTable();
      await loadSavedProgress();
    });

    function generateSnapshotTable() {
      const tbody = document.getElementById('snapshotTableBody');
      let html = '';

      timeSlots.forEach((time) => {
        const timeId = time.replace(/[:\s]/g, '_').toLowerCase();
        html += `
          <tr class="hover:bg-gray-50">
            <td class="border border-gray-300 px-4 py-3 font-semibold text-gray-700">${time}</td>
            <td class="border border-gray-300 px-2 py-2">
              <input 
                type="text" 
                id="oms_${timeId}" 
                class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" 
                placeholder="Enter value"
              />
            </td>
            <td class="border border-gray-300 px-2 py-2">
              <input 
                type="text" 
                id="turnover_${timeId}" 
                class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" 
                placeholder="Enter value"
              />
            </td>
            <td class="border border-gray-300 px-4 py-3 text-center">
              <input 
                type="checkbox" 
                id="matched_${timeId}"
                class="w-5 h-5 cursor-pointer"
              />
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    async function saveProgress() {
      try {
        const formData = {};
        let filledCount = 0;

        // Collect logit work data
        const logitWork = {
          ledger_done: document.getElementById('ledger_done').checked,
          logit_started: document.getElementById('logit_started').checked
        };

        // Collect all snapshot field values
        timeSlots.forEach(time => {
          const timeId = time.replace(/[:\s]/g, '_').toLowerCase();
          const oms = document.getElementById(`oms_${timeId}`).value;
          const turnover = document.getElementById(`turnover_${timeId}`).value;
          const matched = document.getElementById(`matched_${timeId}`).checked;

          if (oms || turnover || matched) {
            formData[time] = {
              oms: oms,
              turnover: turnover,
              matched: matched,
              filled_at: new Date().toISOString(),
              username: currentUser.username,
              user_id: currentUser.id
            };
            filledCount++;
          }
        });

        // Save to backend
        await api.request('/sop/gift-position-data', {
          method: 'POST',
          body: JSON.stringify({
            sop_type: SOP_TYPE,
            form_data: formData,
            logit_work: logitWork,
            date: new Date().toISOString().split('T')[0],
            last_updated_at: new Date().toISOString()
          })
        });

        document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
        alert('✅ Progress saved successfully!');

      } catch (error) {
        console.error('Save error:', error);
        alert('❌ Failed to save: ' + error.message);
      }
    }

    async function loadSavedProgress() {
      try {
        const response = await api.request('/sop/gift-position-data');
        
        if (response && response.form_data) {
          const data = response.form_data;
          
          // Load logit work checkboxes
          if (response.logit_work) {
            document.getElementById('ledger_done').checked = response.logit_work.ledger_done || false;
            document.getElementById('logit_started').checked = response.logit_work.logit_started || false;
          }
          
          // Load snapshot data
          Object.keys(data).forEach(time => {
            const timeId = time.replace(/[:\s]/g, '_').toLowerCase();
            const omsInput = document.getElementById(`oms_${timeId}`);
            const turnoverInput = document.getElementById(`turnover_${timeId}`);
            const matchedCheckbox = document.getElementById(`matched_${timeId}`);

            if (omsInput) omsInput.value = data[time].oms || '';
            if (turnoverInput) turnoverInput.value = data[time].turnover || '';
            if (matchedCheckbox) matchedCheckbox.checked = data[time].matched || false;
          });

          if (response.last_updated_at) {
            document.getElementById('lastUpdated').textContent = new Date(response.last_updated_at).toLocaleString();
          }

          console.log('✅ Loaded saved progress');
        }
      } catch (error) {
        console.log('No saved progress found');
      }
    }
  </script>
</body>
</html>
